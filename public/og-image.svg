<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0A09"/>
  
  <!-- Subtle Grid & Radial Glow -->
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#292524" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#44403C" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Brand Badge -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="#78350F" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="102" cy="101" r="6" fill="#10B981"/>
  <text x="118" y="107" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1">MALKAPUR · MAHARASHTRA</text>

  <!-- Main Headline -->
  <text x="80" y="210" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Jai Baba Electronic
  </text>

  <!-- Tagline / Subtitle -->
  <text x="80" y="270" fill="#E7E5E4" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500">
    Wholesale &amp; Retail Electronics Store
  </text>
  <text x="80" y="310" fill="#A8A29E" font-family="system-ui, -apple-system, sans-serif" font-size="20">
    Ceiling Fans · Room Coolers · Geysers · Mixers · Batteries · Home Appliances
  </text>

  <!-- Categories Pill Grid -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="180" height="48" rx="12" fill="url(#cardGrad)" stroke="#57534E" stroke-width="1"/>
    <text x="90" y="30" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">⚡ Ceiling Fans</text>

    <rect x="195" y="0" width="170" height="48" rx="12" fill="url(#cardGrad)" stroke="#57534E" stroke-width="1"/>
    <text x="280" y="30" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">❄️ Room Coolers</text>

    <rect x="380" y="0" width="160" height="48" rx="12" fill="url(#cardGrad)" stroke="#57534E" stroke-width="1"/>
    <text x="460" y="30" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">♨️ Geysers &amp; Rods</text>

    <rect x="555" y="0" width="190" height="48" rx="12" fill="url(#cardGrad)" stroke="#57534E" stroke-width="1"/>
    <text x="650" y="30" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">🔋 12V Amaron Batt.</text>
  </g>

  <!-- Footer Contact Row -->
  <g transform="translate(80, 480)">
    <!-- Location Card -->
    <rect x="0" y="0" width="480" height="64" rx="14" fill="#1C1917" stroke="#44403C" stroke-width="1"/>
    <text x="24" y="30" fill="#FAFAF9" font-family="system-ui, sans-serif" font-size="16" font-weight="600">📍 Buldana Road, Malkapur, Maharashtra</text>
    <text x="24" y="50" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="13">Mon–Sat: 9:00 AM – 8:00 PM</text>

    <!-- WhatsApp / Call CTA -->
    <rect x="500" y="0" width="340" height="64" rx="14" fill="#047857" stroke="#10B981" stroke-width="1.5"/>
    <text x="525" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">💬 WhatsApp &amp; Call: 8421009925</text>
    <text x="525" y="50" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13">Instant quotation &amp; wholesale rates</text>
  </g>
</svg>

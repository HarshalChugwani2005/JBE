<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background: warm dark stone -->
  <rect width="1200" height="630" fill="#1C1917"/>
  
  <!-- Outer border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#44403C" stroke-width="2" fill="none"/>

  <!-- Brand Badge Top Left -->
  <rect x="70" y="70" width="340" height="42" rx="8" fill="#D97706"/>
  <text x="86" y="97" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="2">EST. BULDA NA ROAD · MALKAPUR</text>

  <!-- Store Type Top Right -->
  <rect x="860" y="70" width="270" height="42" rx="8" fill="#292524" stroke="#44403C" stroke-width="1.5"/>
  <text x="876" y="97" fill="#E7E5E4" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">WHOLESALE &amp; RETAIL</text>

  <!-- Main Store Name -->
  <text x="70" y="200" fill="#FAF7F2" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    Jai Baba Electronic
  </text>

  <!-- Subtitle -->
  <text x="70" y="252" fill="#D97706" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="700">
    Trusted Electronics &amp; Home Appliances Store
  </text>
  <text x="70" y="292" fill="#A8A29E" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="400">
    Ceiling Fans · Room Coolers · Geysers · Mixers · Batteries · Home Appliances
  </text>

  <!-- Core Categories Grid -->
  <g transform="translate(70, 340)">
    <rect x="0" y="0" width="245" height="56" rx="10" fill="#292524" stroke="#44403C" stroke-width="1"/>
    <text x="24" y="35" fill="#FAF7F2" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Ceiling Fans (ZIPSY)</text>

    <rect x="265" y="0" width="245" height="56" rx="10" fill="#292524" stroke="#44403C" stroke-width="1"/>
    <text x="289" y="35" fill="#FAF7F2" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Desert Room Coolers</text>

    <rect x="530" y="0" width="245" height="56" rx="10" fill="#292524" stroke="#44403C" stroke-width="1"/>
    <text x="554" y="35" fill="#FAF7F2" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Water Heaters &amp; Geysers</text>

    <rect x="795" y="0" width="265" height="56" rx="10" fill="#292524" stroke="#44403C" stroke-width="1"/>
    <text x="819" y="35" fill="#FAF7F2" font-family="'Inter', sans-serif" font-size="16" font-weight="700">12V Storage Batteries</text>
  </g>

  <!-- Footer Info Bar -->
  <line x1="70" y1="440" x2="1130" y2="440" stroke="#44403C" stroke-width="1"/>
  
  <g transform="translate(70, 475)">
    <!-- Address -->
    <text x="0" y="24" fill="#FAF7F2" font-family="'Inter', sans-serif" font-size="18" font-weight="700">Buldana Road, Near Bus Stand, Malkapur, Dist. Buldana, Maharashtra</text>
    <text x="0" y="52" fill="#78716C" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Business Hours: Mon–Sat 9:00 AM – 8:00 PM · Sun 10:00 AM – 2:00 PM</text>

    <!-- WhatsApp / Call -->
    <rect x="800" y="0" width="260" height="56" rx="10" fill="#047857"/>
    <text x="825" y="26" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="1">PHONE / WHATSAPP</text>
    <text x="825" y="47" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="18" font-weight="800">+91 84210 09925</text>
  </g>
</svg>
